name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build .app bundle
        run: |
          pyinstaller --clean --noconfirm main.spec
      
      - name: Create DMG
        run: |
          brew install create-dmg || true
          create-dmg \
            --volname "NeteaseMusicDownloader" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "dist/NeteaseMusicDownloader-macOS-${{ matrix.arch }}.dmg" \
            "dist/NeteaseMusicDownloader.app" || true
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.app
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build single .exe
        run: |
          pyinstaller --clean --noconfirm main.spec
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Display structure
        run: find artifacts -type f
      
      - name: Create Release with gh CLI
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "NeteaseMusicDownloader ${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/macos-x64/*.dmg \
            artifacts/macos-arm64/*.dmg \
            artifacts/windows-x64/*.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}