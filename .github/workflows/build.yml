name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- tests
  test:
    name: Lint & tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: pytest -q

  # --------------------------------------------------------------- macOS
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 is Apple silicon, macos-15-intel is the x64 runner.
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check the runner architecture matches the target
        run: |
          python -c "import platform, sys; m = platform.machine(); n = {'x86_64': 'x64', 'amd64': 'x64', 'aarch64': 'arm64'}.get(m, m); print(f'runner {m} -> {n}, target ${{ matrix.arch }}'); sys.exit(0 if n == '${{ matrix.arch }}' else 1)"

      - name: Build .app bundle
        run: pyinstaller --clean --noconfirm main.spec

      - name: Smoke test the bundled app
        run: |
          BIN="dist/NeteaseMusicDownloader.app/Contents/MacOS/NeteaseMusicDownloader"
          test -x "$BIN" || { echo "::error::the executable is missing from the bundle"; exit 1; }
          "$BIN" --self-test --report dist/selftest-${{ matrix.arch }}.txt
          cat dist/selftest-${{ matrix.arch }}.txt

      - name: Package (zip + dmg)
        run: |
          set -euo pipefail
          APP="dist/NeteaseMusicDownloader.app"
          NAME="NeteaseMusicDownloader-macOS-${{ matrix.arch }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/$NAME.zip"
          hdiutil create -volname "NeteaseMusicDownloader" -srcfolder "$APP" \
            -ov -format UDZO "dist/$NAME.dmg"
          ls -lh dist/

      - name: Verify the artifacts are real
        run: |
          set -euo pipefail
          for f in dist/NeteaseMusicDownloader-macOS-${{ matrix.arch }}.zip \
                   dist/NeteaseMusicDownloader-macOS-${{ matrix.arch }}.dmg; do
            size=$(stat -f%z "$f")
            echo "$f -> $size bytes"
            # a real bundle is tens of MB; anything tiny means the build broke
            test "$size" -gt 5000000 || { echo "::error::$f looks truncated"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/NeteaseMusicDownloader-macOS-${{ matrix.arch }}.zip
            dist/NeteaseMusicDownloader-macOS-${{ matrix.arch }}.dmg
            dist/selftest-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------- windows
  build-windows:
    name: Build Windows (x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build single .exe
        run: pyinstaller --clean --noconfirm main.spec

      - name: Smoke test the .exe
        shell: pwsh
        run: |
          $exe = "dist/NeteaseMusicDownloader.exe"
          if (-not (Test-Path $exe)) { Write-Error "the executable was not produced"; exit 1 }
          # The .exe is a GUI-subsystem binary, so PowerShell neither waits for
          # it nor sets $LASTEXITCODE -- Start-Process -Wait -PassThru is the
          # only way to get a real exit code.
          $proc = Start-Process -FilePath $exe `
            -ArgumentList "--self-test", "--report", "dist/selftest-windows.txt" `
            -PassThru
          # Never wait forever: a hung GUI binary would block the runner until
          # the 6 hour job timeout.
          if (-not $proc.WaitForExit(180000)) {
            $proc.Kill()
            if (Test-Path "dist/selftest-windows.txt") { Get-Content "dist/selftest-windows.txt" }
            Write-Error "the self-test did not finish within 180s"
            exit 1
          }
          if ($proc.ExitCode -ne 0) {
            Write-Error "self-test failed with exit code $($proc.ExitCode)"
            exit 1
          }
          Get-Content "dist/selftest-windows.txt"

      - name: Verify the assets unpacked beside the .exe
        shell: pwsh
        run: |
          # The whole point of the Windows layout: the UI must be served from
          # _resources\ next to the .exe, NOT from the onefile temp dir
          # (_MEIPASS), which WebView2 can lose track of -- that produced the
          # "file may have been deleted or moved" page.  Assert the directory
          # and its files really exist, so this regression can never go green.
          $res = Join-Path $PWD "dist\_resources"
          if (-not (Test-Path $res)) {
            Write-Error "the Windows build did not unpack its resources to $res"
            exit 1
          }
          foreach ($f in @("src\gui\assets\index.html", "src\gui\assets\app.js",
                            "src\gui\assets\style.css", "src\gui\assets\desktop-lyrics.html",
                            "src\i18n\zh_cn.json")) {
            if (-not (Test-Path (Join-Path $res $f))) {
              Write-Error "missing from the unpacked resources: $f"
              exit 1
            }
          }
          Write-Host "unpacked resources:"
          Get-ChildItem -Recurse -File $res | Select-Object -First 12 FullName, Length

      - name: Run the app from a non-ASCII path
        shell: pwsh
        run: |
          # The bug this guards: WebView2 refuses a file:// url whose path is
          # not pure ASCII, so a Chinese install directory rendered
          # "file may have been deleted or moved".  The interface now loads over
          # the loopback server, so prove the whole thing starts from such a
          # directory.  Run from a copy so the extracted resources travel with it.
          $cn = Join-Path $PWD "dist\下载测试"
          New-Item -ItemType Directory -Force -Path $cn | Out-Null
          Copy-Item "dist\NeteaseMusicDownloader.exe" $cn
          if (Test-Path "dist\_resources") {
            Copy-Item "dist\_resources" $cn -Recurse -Force
          }
          $exe = Join-Path $cn "NeteaseMusicDownloader.exe"
          # The diagnostics file goes to the settings directory, never into
          # the app folder: a file added to a signed bundle breaks the code
          # signature.  Remove the previous run's file first so this step
          # cannot pass on a stale report.
          $log = Join-Path $env:APPDATA "NeteaseMusicDownloader\ncm-startup.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exe -ArgumentList "--self-test" `
            -WorkingDirectory $cn -PassThru
          if (-not $proc.WaitForExit(180000)) {
            $proc.Kill(); Write-Error "the self-test hung in a non-ASCII path"; exit 1
          }
          if ($proc.ExitCode -ne 0) {
            Write-Error "self-test failed in a non-ASCII path: $($proc.ExitCode)"
            exit 1
          }
          # the diagnostics file must exist and name the http url
          if (-not (Test-Path $log)) { Write-Error "no ncm-startup.log was written"; exit 1 }
          $info = Get-Content $log -Raw | ConvertFrom-Json
          Write-Host "ui_url: $($info.ui_url)"
          if ($info.ui_url -notlike "http://127.0.0.1:*") {
            Write-Error "the interface was not loaded over http: $($info.ui_url)"
            exit 1
          }
          if ($info.ui_url -match "[^\x00-\x7F]") {
            Write-Error "the url contains non-ASCII characters: $($info.ui_url)"
            exit 1
          }
          Write-Host "OK: interface loads over http from a Chinese path"

      - name: Package (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/NeteaseMusicDownloader.exe" `
            -DestinationPath "dist/NeteaseMusicDownloader-Windows-x64.zip" -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: Verify the artifacts are real
        shell: pwsh
        run: |
          $zip = Get-Item "dist/NeteaseMusicDownloader-Windows-x64.zip"
          Write-Host "$($zip.Name) -> $($zip.Length) bytes"
          if ($zip.Length -lt 5000000) { Write-Error "the zip looks truncated"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/NeteaseMusicDownloader.exe
            dist/NeteaseMusicDownloader-Windows-x64.zip
            dist/selftest-windows.txt
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------- release
  release:
    name: Publish release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check the collected artifacts
        run: |
          set -euo pipefail
          ls -lh artifacts
          expected="
          NeteaseMusicDownloader-Windows-x64.zip
          NeteaseMusicDownloader-macOS-arm64.zip
          NeteaseMusicDownloader-macOS-arm64.dmg
          NeteaseMusicDownloader-macOS-x64.zip
          NeteaseMusicDownloader-macOS-x64.dmg
          NeteaseMusicDownloader.exe
          "
          missing=0
          for name in $expected; do
            if [ ! -f "artifacts/$name" ]; then echo "::error::missing artifact $name"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          cat artifacts/selftest-*.txt

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # The notes are written by the maintainer, not generated from the
          # commit log: `--generate-notes` fills the page with commit
          # subjects, which are development notes, not user-facing copy.
          # They live in release-notes.md at the repository root, so the text
          # that ships with a version is reviewed together with the code.
          if [ ! -f release-notes.md ]; then
            echo "::error::release-notes.md is missing: the release would have no description"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists - uploading the assets again"
            gh release upload "$tag" artifacts/*.exe artifacts/*.zip artifacts/*.dmg --clobber
          else
            # --prerelease on purpose: a tagged build is a candidate, not a
            # stable release.  It is promoted with
            #   gh release edit <tag> --prerelease=false
            # after the release has been tested.  Without the flag the release
            # lands as stable and "/releases/latest" points at it.
            gh release create "$tag" \
              --title "NeteaseMusicDownloader $tag" \
              --prerelease \
              --notes-file release-notes.md \
              artifacts/NeteaseMusicDownloader.exe \
              artifacts/NeteaseMusicDownloader-Windows-x64.zip \
              artifacts/NeteaseMusicDownloader-macOS-arm64.zip \
              artifacts/NeteaseMusicDownloader-macOS-arm64.dmg \
              artifacts/NeteaseMusicDownloader-macOS-x64.zip \
              artifacts/NeteaseMusicDownloader-macOS-x64.dmg
          fi

      - name: Verify the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$GITHUB_REF_NAME" --json tagName,isPrerelease,assets
