[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: talks to the real NetEase API (opt in with NCM_LIVE=1)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# android/webview, android/proxytools, android/yaml and
# android/typing_extensions.py are upstream packages vendored so the Android
# build can carry them; they are not our code and are not held to this
# project's style.
exclude = ["build", "dist", "legacy", ".venv", "android/webview", "android/proxytools", "android/yaml", "android/typing_extensions.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = [
    "E501",   # long lines are handled by the formatter
    "B008",   # function calls in argument defaults (pywebview style)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
