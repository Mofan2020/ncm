[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: talks to the real NetEase API (opt in with NCM_LIVE=1)",
    "real_cache: uses the real metadata cache root instead of a per-test one",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "build",
    "dist",
    "legacy",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = [
    "E501",   # long lines are handled by the formatter
    "B008",   # function calls in argument defaults (pywebview style)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
