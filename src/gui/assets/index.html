<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>NetEase Music Playlist Downloader</title>
    <link rel="stylesheet" href="style.css">
    <script>
        /* Apply the theme before the first paint: main.py puts the persisted
           mode in the query string, and `system` follows the OS setting.
           Without this the window flashes white when the app runs in dark. */
        (function () {
            var params = new URLSearchParams(window.location.search);
            var mode = params.get('mode') || 'system';
            var resolved = params.get('theme');
            if (resolved !== 'dark' && resolved !== 'light') {
                resolved = (mode !== 'system')
                    ? mode
                    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            }
            var root = document.documentElement;
            root.setAttribute('data-theme', resolved === 'dark' ? 'dark' : 'light');
            root.dataset.themeMode = (mode === 'light' || mode === 'dark') ? mode : 'system';
        })();
    </script>
</head>
<body>
<div id="app">
    <header class="app-header">
        <div class="brand">
            <h1 data-i18n="app.title">网易云音乐歌单下载器</h1>
            <p class="subtitle" data-i18n="app.subtitle"></p>
        </div>
        <div class="header-actions">
            <button id="btn-theme" class="btn btn-icon" type="button"
                    data-i18n-title="settings.theme_toggle" aria-label="theme">◐</button>
            <button id="btn-login" class="btn btn-primary" type="button" data-i18n="login.title"></button>
            <button id="btn-settings" class="btn btn-icon" type="button"
                    data-i18n-title="settings.title" aria-label="settings">⚙</button>
        </div>
    </header>

    <main class="layout">
        <div class="column-main">
            <!-- playlist input -->
            <section class="card">
                <div class="card-head">
                    <h2 data-i18n="download.title"></h2>
                </div>
                <div class="card-body">
                    <div class="inline-form">
                        <label class="sr-only" for="playlist-input" data-i18n="playlist.input_label"></label>
                        <input type="text" id="playlist-input" data-i18n-placeholder="playlist.placeholder"
                               autocomplete="off" spellcheck="false">
                        <button id="btn-fetch" class="btn btn-primary" type="button"
                                data-i18n="playlist.fetch_btn"></button>
                    </div>
                    <div class="option-grid">
                        <label class="option">
                            <span data-i18n="download.quality_label"></span>
                            <select id="quality-select">
                                <option value="standard" data-i18n="download.quality_standard"></option>
                                <option value="higher" data-i18n="download.quality_higher"></option>
                                <option value="exhigh" data-i18n="download.quality_exhigh"></option>
                                <option value="lossless" data-i18n="download.quality_lossless"></option>
                                <option value="hires" data-i18n="download.quality_hires"></option>
                            </select>
                        </label>
                        <label class="option">
                            <span data-i18n="download.concurrent_label"></span>
                            <select id="concurrent-select">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                            </select>
                        </label>
                        <label class="option checkbox">
                            <input type="checkbox" id="overwrite-check">
                            <span data-i18n="download.overwrite_label"></span>
                        </label>
                        <label class="option checkbox">
                            <input type="checkbox" id="lyrics-check" checked>
                            <span data-i18n="settings.download_lyrics"></span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- playlist info -->
            <section class="card" id="playlist-card" hidden>
                <div class="card-head">
                    <h2 data-i18n="playlist.title"></h2>
                </div>
                <div class="card-body playlist-info">
                    <img id="playlist-cover" class="cover" src="" alt="">
                    <div class="playlist-meta">
                        <h3 id="playlist-name">--</h3>
                        <p id="playlist-creator">--</p>
                        <p id="playlist-count">--</p>
                    </div>
                </div>
            </section>

            <!-- tracks -->
            <section class="card" id="song-card" hidden>
                <div class="card-head">
                    <h2><span data-i18n="playlist.tracks"></span> <span id="tracks-count" class="muted"></span></h2>
                    <div class="card-head-actions">
                        <button id="btn-select-all" class="btn btn-sm" type="button"
                                data-i18n="download.select_all"></button>
                        <button id="btn-select-none" class="btn btn-sm" type="button"
                                data-i18n="download.deselect_all"></button>
                    </div>
                </div>
                <div class="song-list" id="song-list"></div>
            </section>

            <!-- download controls -->
            <section class="card">
                <div class="card-body">
                    <div class="download-controls">
                        <button id="btn-start" class="btn btn-primary btn-lg" type="button" disabled
                                data-i18n="download.start_btn"></button>
                        <button id="btn-pause" class="btn btn-secondary" type="button" disabled
                                data-i18n="download.pause_btn"></button>
                        <button id="btn-cancel" class="btn btn-danger" type="button" disabled
                                data-i18n="download.cancel_btn"></button>
                        <button id="btn-open-folder" class="btn btn-ghost" type="button"
                                data-i18n="download.open_folder"></button>
                    </div>
                    <div class="overall">
                        <div class="progress-track">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <div class="overall-meta">
                            <span id="progress-text">0%</span>
                            <span id="overall-speed"></span>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <aside class="column-side">
            <section class="card side-card">
                <div class="card-head">
                    <h2 data-i18n="download.queue_title"></h2>
                </div>
                <div class="queue" id="download-queue">
                    <p class="empty" id="empty-queue" data-i18n="download.queue_empty"></p>
                </div>
            </section>
        </aside>
    </main>

    <footer class="status-bar">
        <span id="status-text" data-i18n="status.ready"></span>
        <span id="stats-text" class="muted"></span>
    </footer>
</div>

<!-- ============ login modal ============ -->
<div class="modal" id="login-modal" hidden>
    <div class="modal-backdrop" data-close="login-modal"></div>
    <div class="modal-box" role="dialog" aria-modal="true">
        <header class="modal-head">
            <h2 data-i18n="login.title"></h2>
            <button class="btn btn-icon" type="button" data-close="login-modal">✕</button>
        </header>
        <div class="modal-body">
            <p class="muted" data-i18n="login.subtitle"></p>
            <div class="tabs" id="login-tabs">
                <button class="tab is-active" type="button" data-tab="qrcode"
                        data-i18n="login.qrcode_tab"></button>
                <button class="tab" type="button" data-tab="phone" data-i18n="login.phone_tab"></button>
                <button class="tab" type="button" data-tab="cookie" data-i18n="login.cookie_tab"></button>
            </div>

            <div class="tab-panel is-active" data-panel="qrcode">
                <div class="qr-wrap">
                    <img id="qrcode-image" class="qr" src="" alt="">
                    <p class="muted" data-i18n="login.qrcode_tip"></p>
                    <p id="qrcode-status" class="qr-status"></p>
                </div>
                <button id="btn-refresh-qrcode" class="btn btn-secondary" type="button"
                        data-i18n="login.qrcode_refresh"></button>
            </div>

            <div class="tab-panel" data-panel="phone">
                <label class="option">
                    <span data-i18n="login.phone_label"></span>
                    <div class="inline-form">
                        <input type="tel" id="phone-input" data-i18n-placeholder="login.phone_placeholder"
                               autocomplete="off">
                        <button id="btn-send-code" class="btn btn-secondary" type="button"
                                data-i18n="login.send_code"></button>
                    </div>
                </label>
                <label class="option">
                    <span data-i18n="login.code_label"></span>
                    <input type="text" id="code-input" data-i18n-placeholder="login.code_placeholder"
                           autocomplete="off">
                </label>
                <button id="btn-phone-login" class="btn btn-primary btn-block" type="button"
                        data-i18n="login.login_btn"></button>
            </div>

            <div class="tab-panel" data-panel="cookie">
                <label class="option">
                    <span data-i18n="login.cookie_label"></span>
                    <textarea id="cookie-input" rows="4" data-i18n-placeholder="login.cookie_placeholder"
                              spellcheck="false"></textarea>
                </label>
                <button id="btn-cookie-login" class="btn btn-primary btn-block" type="button"
                        data-i18n="login.cookie_import"></button>
            </div>
        </div>
    </div>
</div>

<!-- ============ settings modal ============ -->
<div class="modal" id="settings-modal" hidden>
    <div class="modal-backdrop" data-close="settings-modal"></div>
    <div class="modal-box" role="dialog" aria-modal="true">
        <header class="modal-head">
            <h2 data-i18n="settings.title"></h2>
            <button class="btn btn-icon" type="button" data-close="settings-modal">✕</button>
        </header>
        <div class="modal-body">
            <div class="tabs" id="settings-tabs">
                <button class="tab is-active" type="button" data-tab="general"
                        data-i18n="settings.general"></button>
                <button class="tab" type="button" data-tab="download" data-i18n="settings.download"></button>
                <button class="tab" type="button" data-tab="advanced"
                        data-i18n="settings.advanced"></button>
            </div>

            <div class="tab-panel is-active" data-panel="general">
                <label class="option">
                    <span data-i18n="settings.language"></span>
                    <select id="language-select"></select>
                </label>
                <label class="option">
                    <span data-i18n="settings.theme"></span>
                    <select id="theme-select">
                        <option value="light" data-i18n="settings.theme_light"></option>
                        <option value="dark" data-i18n="settings.theme_dark"></option>
                        <option value="system" data-i18n="settings.theme_system"></option>
                    </select>
                </label>
            </div>

            <div class="tab-panel" data-panel="download">
                <label class="option">
                    <span data-i18n="settings.download_dir"></span>
                    <div class="inline-form">
                        <input type="text" id="download-dir-input" readonly>
                        <button id="btn-choose-dir" class="btn btn-secondary" type="button"
                                data-i18n="settings.choose_dir"></button>
                    </div>
                </label>
                <label class="option">
                    <span data-i18n="settings.default_quality"></span>
                    <select id="default-quality-select">
                        <option value="standard" data-i18n="download.quality_standard"></option>
                        <option value="higher" data-i18n="download.quality_higher"></option>
                        <option value="exhigh" data-i18n="download.quality_exhigh"></option>
                        <option value="lossless" data-i18n="download.quality_lossless"></option>
                        <option value="hires" data-i18n="download.quality_hires"></option>
                    </select>
                </label>
                <label class="option">
                    <span data-i18n="settings.max_concurrent"></span>
                    <select id="max-concurrent-select">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </label>
                <label class="option checkbox">
                    <input type="checkbox" id="overwrite-files-check">
                    <span data-i18n="settings.overwrite_files"></span>
                </label>
                <label class="option checkbox">
                    <input type="checkbox" id="download-lyrics-check">
                    <span data-i18n="settings.download_lyrics"></span>
                </label>
                <label class="option checkbox indent">
                    <input type="checkbox" id="lyrics-translation-check">
                    <span data-i18n="settings.lyrics_translation"></span>
                </label>
            </div>

            <div class="tab-panel" data-panel="advanced">
                <label class="option checkbox">
                    <input type="checkbox" id="remember-login-check">
                    <span data-i18n="settings.remember_login"></span>
                </label>
                <label class="option checkbox">
                    <input type="checkbox" id="debug-check">
                    <span data-i18n="settings.debug_mode"></span>
                </label>
                <div class="about">
                    <h3 data-i18n="about.title"></h3>
                    <p id="about-version" class="muted"></p>
                    <p id="about-description" class="muted" data-i18n="about.description"></p>
                    <p id="about-author" class="muted"></p>
                    <button id="btn-open-homepage" class="btn btn-link" type="button"
                            data-i18n="about.github"></button>
                </div>
            </div>
        </div>
        <footer class="modal-foot">
            <button id="btn-reset-settings" class="btn btn-ghost" type="button"
                    data-i18n="settings.reset_settings"></button>
            <button id="btn-save-settings" class="btn btn-primary" type="button"
                    data-i18n="common.save"></button>
        </footer>
    </div>
</div>

<!-- ============ confirm dialog ============ -->
<div class="modal" id="confirm-modal" hidden>
    <div class="modal-backdrop" data-close="confirm-modal"></div>
    <div class="modal-box modal-box-sm" role="dialog" aria-modal="true">
        <header class="modal-head">
            <h2 data-i18n="common.warning"></h2>
        </header>
        <div class="modal-body">
            <p id="confirm-message"></p>
        </div>
        <footer class="modal-foot">
            <button id="btn-confirm-cancel" class="btn btn-ghost" type="button"
                    data-i18n="common.cancel"></button>
            <button id="btn-confirm-ok" class="btn btn-danger" type="button"
                    data-i18n="common.ok"></button>
        </footer>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
