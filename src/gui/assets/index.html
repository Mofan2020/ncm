<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易云音乐歌单下载器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1 id="app-title">网易云音乐歌单下载器</h1>
                <span id="app-subtitle" class="subtitle">专为macOS优化 | 稳定可靠的歌单下载工具</span>
            </div>
            <div class="header-right">
                <button id="btn-login" class="btn btn-primary" onclick="showLoginModal()">登录</button>
                <button id="btn-settings" class="btn btn-icon" onclick="showSettingsModal()" title="设置">⚙</button>
                <button id="btn-minimize" class="btn btn-icon" onclick="minimizeWindow()" title="最小化">─</button>
                <button id="btn-maximize" class="btn btn-icon" onclick="maximizeWindow()" title="最大化">□</button>
                <button id="btn-close" class="btn btn-icon btn-close" onclick="closeWindow()" title="关闭">✕</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Panel: Playlist & Download -->
            <div class="left-panel">
                <!-- Playlist Input -->
                <div class="card">
                    <div class="card-header">
                        <h2 id="download-title">下载管理</h2>
                    </div>
                    <div class="card-body">
                        <div class="input-group">
                            <input type="text" id="playlist-input" placeholder="输入歌单ID或粘贴歌单链接 (如: https://music.163.com/playlist?id=123456)">
                            <button id="btn-fetch" class="btn btn-primary" onclick="fetchPlaylist()">获取歌单</button>
                        </div>
                        
                        <!-- Quality & Options -->
                        <div class="options-row">
                            <div class="option-group">
                                <label id="quality-label">音质选择</label>
                                <select id="quality-select">
                                    <option value="standard">标准 (128kbps MP3)</option>
                                    <option value="higher">较高 (192kbps MP3)</option>
                                    <option value="exhigh">极高 (320kbps MP3)</option>
                                    <option value="lossless">无损 (FLAC)</option>
                                    <option value="hires">Hi-Res (高品质无损)</option>
                                </select>
                            </div>
                            <div class="option-group">
                                <label id="concurrent-label">并发下载数</label>
                                <select id="concurrent-select">
                                    <option value="1">1</option>
                                    <option value="2" selected>2</option>
                                    <option value="3">3</option>
                                </select>
                            </div>
                        </div>
                        <div class="options-row">
                            <label class="checkbox-label">
                                <input type="checkbox" id="overwrite-check">
                                <span id="overwrite-label">覆盖已存在文件</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" id="skip-check-check">
                                <span id="skip-check-label">跳过URL检查</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Playlist Info -->
                <div class="card" id="playlist-card" style="display:none;">
                    <div class="card-header">
                        <h2 id="playlist-title">歌单信息</h2>
                    </div>
                    <div class="card-body">
                        <div class="playlist-info">
                            <img id="playlist-cover" class="playlist-cover" src="" alt="封面">
                            <div class="playlist-meta">
                                <h3 id="playlist-name">--</h3>
                                <p id="playlist-creator">--</p>
                                <p id="playlist-count">--</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Song List -->
                <div class="card" id="song-list-card" style="display:none;">
                    <div class="card-header">
                        <div class="header-row">
                            <h2 id="tracks-title">歌曲列表</h2>
                            <div class="header-actions">
                                <button class="btn btn-sm" onclick="selectAll()">全选</button>
                                <button class="btn btn-sm" onclick="deselectAll()">取消全选</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="song-list" id="song-list">
                            <!-- Songs will be rendered here -->
                        </div>
                    </div>
                </div>

                <!-- Download Controls -->
                <div class="card">
                    <div class="card-body">
                        <div class="download-controls">
                            <button id="btn-start" class="btn btn-primary btn-lg" onclick="startDownload()" disabled>开始下载</button>
                            <button id="btn-pause" class="btn btn-secondary" onclick="pauseDownload()" disabled>暂停</button>
                            <button id="btn-cancel" class="btn btn-danger" onclick="cancelDownload()" disabled>取消</button>
                            <button id="btn-open-folder" class="btn btn-secondary" onclick="openFolder()" disabled>打开文件夹</button>
                        </div>
                        <div class="progress-bar-container" id="progress-container" style="display:none;">
                            <div class="progress-bar" id="progress-bar"></div>
                            <span class="progress-text" id="progress-text">0%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Download Queue -->
            <div class="right-panel">
                <div class="card">
                    <div class="card-header">
                        <h2 id="download-queue-title">下载队列</h2>
                    </div>
                    <div class="card-body">
                        <div class="download-queue" id="download-queue">
                            <div class="empty-state" id="empty-queue">
                                <p>暂无下载任务</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Status Bar -->
        <footer class="status-bar">
            <span id="status-text">就绪</span>
            <span id="stats-text"></span>
        </footer>
    </div>

    <!-- Login Modal -->
    <div class="modal" id="login-modal" style="display:none;">
        <div class="modal-overlay" onclick="hideLoginModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="login-title">登录网易云音乐</h2>
                <button class="btn btn-icon" onclick="hideLoginModal()">✕</button>
            </div>
            <div class="modal-body">
                <p class="modal-subtitle" id="login-subtitle">登录后可下载非公开歌单、VIP歌曲</p>
                
                <!-- Login Tabs -->
                <div class="tabs">
                    <button class="tab active" data-tab="qrcode" onclick="switchLoginTab('qrcode')">二维码登录</button>
                    <button class="tab" data-tab="phone" onclick="switchLoginTab('phone')">手机验证码</button>
                    <button class="tab" data-tab="cookie" onclick="switchLoginTab('cookie')">Cookie导入</button>
                </div>

                <!-- QR Code Tab -->
                <div class="tab-content active" id="tab-qrcode">
                    <div class="qrcode-container">
                        <img id="qrcode-image" class="qrcode-image" src="" alt="QR Code">
                        <p id="qrcode-tip" class="qrcode-tip">请使用网易云音乐App扫码登录</p>
                        <p id="qrcode-status" class="qrcode-status"></p>
                    </div>
                    <button id="btn-refresh-qrcode" class="btn btn-secondary" onclick="refreshQrcode()">刷新二维码</button>
                </div>

                <!-- Phone Tab -->
                <div class="tab-content" id="tab-phone">
                    <div class="form-group">
                        <label id="phone-label">手机号</label>
                        <div class="input-group">
                            <input type="tel" id="phone-input" placeholder="请输入手机号">
                            <button id="btn-send-code" class="btn btn-secondary" onclick="sendPhoneCode()">发送验证码</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label id="code-label">验证码</label>
                        <input type="text" id="code-input" placeholder="请输入验证码">
                    </div>
                    <button id="btn-phone-login" class="btn btn-primary btn-block" onclick="loginPhone()">登录</button>
                </div>

                <!-- Cookie Tab -->
                <div class="tab-content" id="tab-cookie">
                    <div class="form-group">
                        <label id="cookie-label">Cookie</label>
                        <textarea id="cookie-input" placeholder="粘贴登录后的Cookie (MUSIC_U等)" rows="4"></textarea>
                    </div>
                    <button id="btn-cookie-login" class="btn btn-primary btn-block" onclick="loginCookie()">导入Cookie</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settings-modal" style="display:none;">
        <div class="modal-overlay" onclick="hideSettingsModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="settings-title">设置</h2>
                <button class="btn btn-icon" onclick="hideSettingsModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="tabs">
                    <button class="tab active" data-tab="general" onclick="switchSettingsTab('general')">通用</button>
                    <button class="tab" data-tab="download" onclick="switchSettingsTab('download')">下载</button>
                    <button class="tab" data-tab="advanced" onclick="switchSettingsTab('advanced')">高级</button>
                </div>

                <!-- General Tab -->
                <div class="tab-content active" id="settings-general">
                    <div class="form-group">
                        <label id="language-label">语言</label>
                        <select id="language-select" onchange="changeLanguage(this.value)">
                            <option value="zh_cn">简体中文</option>
                            <option value="en_us">English</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="theme-label">主题</label>
                        <select id="theme-select">
                            <option value="light">浅色</option>
                            <option value="dark">深色</option>
                            <option value="system">跟随系统</option>
                        </select>
                    </div>
                </div>

                <!-- Download Tab -->
                <div class="tab-content" id="settings-download">
                    <div class="form-group">
                        <label id="download-dir-label">下载目录</label>
                        <div class="input-group">
                            <input type="text" id="download-dir-input" readonly>
                            <button class="btn btn-secondary" onclick="chooseDirectory()">选择目录</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label id="default-quality-label">默认音质</label>
                        <select id="default-quality-select">
                            <option value="standard">标准</option>
                            <option value="higher">较高</option>
                            <option value="exhigh">极高</option>
                            <option value="lossless">无损</option>
                            <option value="hires">Hi-Res</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="max-concurrent-label">最大并发数</label>
                        <select id="max-concurrent-select">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                        </select>
                    </div>
                </div>

                <!-- Advanced Tab -->
                <div class="tab-content" id="settings-advanced">
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="debug-check">
                            <span id="debug-label">调试模式</span>
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember-login-check">
                            <span id="remember-login-label">记住登录状态</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="resetSettings()">重置设置</button>
                <button class="btn btn-primary" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
