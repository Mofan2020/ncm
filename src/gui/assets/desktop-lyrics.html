<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面歌词</title>
    <script>
        // Read initial settings from URL params before styles load
        (function() {
            const params = new URLSearchParams(window.location.search);
            const fontSize = parseInt(params.get('fontSize') || '18', 10);
            const color = decodeURIComponent(params.get('color') || '#ffffff');
            const opacity = parseFloat(params.get('opacity') || '0.9');
            const showTranslation = params.get('showTranslation') !== 'false';
            
            // Store in localStorage for desktop-lyrics.js to read
            localStorage.setItem('ncm:desktop-lyrics:settings', JSON.stringify({
                fontSize: fontSize,
                color: color,
                opacity: opacity,
                showTranslation: showTranslation
            }));
        })();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; background: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
        
        .desktop-lyrics-window {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2147483647;
            pointer-events: none;
        }
        .desktop-lyrics-window.draggable { pointer-events: auto; }
        /* The overlay is click-through so it never blocks the desktop, but
           the lyric content and the drag handle must stay interactive --
           without this the right-click menu (hide / close) could never be
           reached, because `pointer-events: none` also suppresses
           `contextmenu` and `dblclick`. */
        .desktop-lyrics-content,
        .desktop-lyrics-drag-handle { pointer-events: auto; }
        
        .desktop-lyrics-content {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 12px 24px;
            border-radius: 999px;
            font-size: 18px;
            font-weight: 500;
            white-space: nowrap;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background-color 0.3s, color 0.3s, opacity 0.3s;
        }
        
        .lyric-lines {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .lyric-line {
            opacity: 0.5;
            transform: scale(0.95);
            transition: opacity 0.3s cubic-bezier(0.22, 1, 0.36, 1), transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), color 0.3s;
            white-space: nowrap;
            text-align: center;
        }
        .lyric-line.current {
            opacity: 1;
            transform: scale(1.03);
        }
        .lyric-line.translation {
            display: block;
            font-size: 0.7em;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 2px;
            font-weight: 400;
        }
        /* Prev/current/next rows: the only DOM the runtime needs.  The
           wrapping container is unchanged so the drag handle still anchors
           to `.desktop-lyrics-content`. */
        .lyric-prev, .lyric-next {
            opacity: 0.45;
            font-size: 0.8em;
            line-height: 1.3;
        }
        .lyric-current {
            opacity: 1;
            font-weight: 600;
            font-size: 1.15em;
            line-height: 1.3;
        }
        .lyric-translation {
            opacity: 0.85;
            font-size: 0.85em;
            line-height: 1.3;
            font-weight: 400;
            margin-top: 4px;
        }
        
        .desktop-lyrics-drag-handle {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            cursor: grab;
        }
        .desktop-lyrics-drag-handle:active { cursor: grabbing; }
        
        .desktop-lyrics-hidden .desktop-lyrics-content { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="desktop-lyrics-window" id="dl-window">
        <div class="desktop-lyrics-drag-handle" id="dl-drag-handle" title="拖拽移动位置"></div>
        <div class="desktop-lyrics-content" id="dl-content">
            <div class="lyric-prev"></div>
            <div class="lyric-current">桌面歌词就绪</div>
            <div class="lyric-next"></div>
            <div class="lyric-translation" hidden></div>
        </div>
    </div>
    <script src="icons.js"></script>
    <script src="desktop-lyrics.js"></script>
</body>
</html>
